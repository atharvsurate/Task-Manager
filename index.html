<!DOCTYPE html>
<html>
<head>
    <title>Gamified To-Do</title>
    <style>
        h1 {
            color: rgb(255, 166, 0);
        }
        body { font-family: sans-serif; text-align: center; background: #eee; margin-top: 50px; }
        .box { background: #fff; max-width: 350px; margin: auto; padding: 20px; border: 1px solid #ccc; }
        .stats { background: #d4edda; padding: 10px; margin-bottom: 15px; color: #155724; font-weight: bold; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px; cursor: pointer; background: #007bff; color: #fff; border: none; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { padding: 10px; border-bottom: 1px solid #ddd; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>TO DO TASK</h1>
    <div class="box">
        <div class="stats" id="sb"></div>
        <input type="text" id="inp" placeholder="Add task...">
        <button onclick="add()">Add</button>
        <ul id="list"></ul>
    </div>
    <script>
        let tasks = JSON.parse(localStorage.getItem('ts')) || [], xp = Number(localStorage.getItem('xp')) || 0, lvl = Number(localStorage.getItem('lvl')) || 1;

        function show() {
            document.getElementById("sb").innerText = `Level: ${lvl} | XP: ${xp}/100`;
            let html = "";
            for (let i = 0; i < tasks.length; i++) {
                html += `<li class="${tasks[i].d ? 'done' : ''}"><input type="checkbox" ${tasks[i].d ? 'checked' : ''} onchange="tog(${i})"> ${tasks[i].t} <button onclick="del(${i})" style="float:right; background:red;">X</button></li>`;
            }
            document.getElementById("list").innerHTML = html;
        }

        function add() {
            let v = document.getElementById("inp").value;
            if(v) { tasks.push({t: v, d: false}); save(); }
        }

        function tog(i) {
            tasks[i].d = !tasks[i].d; 
            xp += tasks[i].d ? 20 : -20; // Short IF
            if(xp >= 100) { lvl++; xp = 0; alert(`Level ${lvl}!`); }
            save(); 
        }

        function del(i) { tasks.splice(i, 1); save(); }
        
        function save() {
            localStorage.setItem('ts', JSON.stringify(tasks)); localStorage.setItem('xp', xp); localStorage.setItem('lvl', lvl);
            document.getElementById("inp").value = ""; show();
        }
        show();
    </script>
</body>
</html>
